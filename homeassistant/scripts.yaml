activate_alexa_actionable_notification:
  description: Activates an actionable notification on a specific echo device
  fields:
    text:
      description: The text you would like alexa to speak.
      example: What would you like the thermostat set to?
    event_id:
      description: Correlation ID for event responses
      example: ask_for_temperature
    alexa_device:
      description: Alexa device you want to trigger
      example: media_player.bedroom_echo
  sequence:
  - service: input_text.set_value
    data_template:
      entity_id: input_text.alexa_actionable_notification
      value: '{"text": "{{ text }}", "event": "{{ event_id }}"}'
  - service: media_player.play_media
    data_template:
      entity_id: '{{ alexa_device }}'
      media_content_type: skill
      media_content_id: amzn1.ask.skill.0742c625-533c-4494-9be0-48503f08d03c
toggle_pc_speakers_power:
  sequence:
  - action: remote.send_command
    metadata: {}
    target:
      device_id: a71c642cd0c9300c524742e41a8399f1
    data:
      device: PC Speakers
      command: Power
  alias: Toggle PC Speakers Power
  description: ''
pc_lg_monitor_fan_low:
  sequence:
  - action: remote.send_command
    metadata: {}
    target:
      entity_id: remote.broadlink_rm4m_office
    data:
      device: pc_lg_monitor
      command: In Start
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: remote.send_command
    metadata: {}
    target:
      entity_id: remote.broadlink_rm4m_office
    data:
      num_repeats: 20
      delay_secs: 0.4
      device: pc_lg_monitor
      command: Down Arrow
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: remote.send_command
    metadata: {}
    target:
      entity_id: remote.broadlink_rm4m_office
    data:
      num_repeats: 25
      delay_secs: 0.4
      device: pc_lg_monitor
      command: Left Arrow
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: remote.send_command
    metadata: {}
    target:
      entity_id: remote.broadlink_rm4m_office
    data:
      device: pc_lg_monitor
      command: Ok
  alias: PC LG Monitor Fan Low
  description: ''
